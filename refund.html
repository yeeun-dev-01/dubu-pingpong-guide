<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환불 및 일시정지 | 두부핑퐁</title>
<meta property="og:title" content="환불 및 일시정지 | 두부핑퐁">
<meta property="og:description" content="환불 기준·중도 해지·일시정지 조건">

<link rel="stylesheet" href="assets/common.css">
<style>
.rf{border:1px solid var(--line);border-radius:16px;overflow:hidden;break-inside:avoid}
.rf+.rf{margin-top:12px}
.rf-h{padding:12px 16px;background:var(--gray);font-size:15px;font-weight:800;color:var(--ink)}
.rf-h span{font-size:12.5px;font-weight:600;color:var(--muted);margin-left:6px}
.rf-row{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;padding:14px 16px}
.rf-row+.rf-row{border-top:1px solid var(--line)}
.rf .when{font-size:13.5px;font-weight:700;color:var(--sub)}
.rf .what{font-size:14.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.rf .what b{color:var(--ink)}
.rf .what.big{color:var(--blue-deep)}
.rf .what.muted{color:var(--muted)}
.rf .what{white-space:nowrap}
.rf-row.stack{grid-template-columns:1fr;gap:4px}
.rf .what.normal{font-weight:400;color:var(--sub)}
.rf .lab{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
</style>
</head>
<body>
<main class="doc">

  <header class="top">
    <img class="logo" src="assets/dubu-logo.png" alt="dubu">
    <p class="no">두부핑퐁 안내</p>
    <h1>환불 및 일시정지</h1>
    <p class="summary">환불 기준·중도 해지·일시정지 조건</p>
  </header>

  <section>
    <h2>환불 정책</h2>

    <div class="rf">
      <div class="rf-h">정기권 <span>12개월권 · 6개월권</span></div>
      <div class="rf-row">
        <div class="when">2회차까지</div>
        <div class="what big">전액 환불</div>
      </div>
      <div class="rf-row stack">
        <div class="when">3회차부터 환불 금액</div>
        <div class="what">결제 금액 − (이용 회기 × 48,750원(정가))</div>
      </div>
    </div>

    <div class="rf">
      <div class="rf-h">1개월권</div>
      <div class="rf-row">
        <div class="when">첫 수업 전</div>
        <div class="what big">전액 환불</div>
      </div>
      <div class="rf-row">
        <div class="when">수업 시작 후</div>
        <div class="what muted">환불 불가</div>
      </div>
    </div>

    <p class="small mt12">환불은 접수 후 영업일 기준 3~7일 안에 처리돼요. 카드사나 네이버페이는 반영이 더 늦을 수 있어요.</p>
  </section>

  <section>
    <h2>일시정지</h2>
    <div class="rf">
      <div class="rf-h">정기권 <span>12개월권 · 6개월권</span></div>
      <div class="rf-row">
        <div class="when">가능 기간</div>
        <div class="what big">1달</div>
      </div>
      <div class="rf-row">
        <div class="when">신청 방법</div>
        <div class="what">카카오톡 홈즈코치 채널</div>
      </div>
    </div>
  </section>

  <footer class="foot">
    궁금하신 점은 카카오톡 두부핑퐁 채널로 문의해 주세요.
  </footer>

</main>
</body>
</html>
